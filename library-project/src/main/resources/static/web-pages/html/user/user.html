<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Books Master Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  </head>
  <body class="container my-5 border p-4">
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-outline-light me-3"
          type="button" data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasSidebar">
          <i class="bi bi-list" id="toggleIcon"></i>
        </button>
        <a class="navbar-brand" href="User.html"><i class="bi bi-book"></i>
          Library</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <form class="d-flex ms-auto"
            onsubmit="event.preventDefault(); handleSearch();">
            <input id="searchInput" class="form-control me-2" type="search"
              placeholder="Search books" />
            <button class="btn btn-outline-success"
              type="submit">Search</button>
          </form>
          <ul class="navbar-nav ms-3">
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="loadPage('Cart.html')"><i
                  class="bi bi-cart-fill" id="cartIcon"></i> Cart</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="offcanvas offcanvas-start offcanvas-sidebar"
      id="offcanvasSidebar">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close"
          data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <div class="list-group">
          <a href="#" onclick="loadPage('Profile.html')"
            class="list-group-item list-group-item-action">Profile</a>
          <a href="#" onclick="loadPage('ReturnBook.html')"
            class="list-group-item list-group-item-action">Return Book</a>
          <a href="#" onclick="loadPage('UserHistory.html')"
            class="list-group-item list-group-item-action">History</a>
            <a href="#" onclick="loadPage('UserReports.html')"
            class="list-group-item list-group-item-action">Reports</a>
          <a href="#" onclick="loadPage('UserContact.html')"
            class="list-group-item list-group-item-action">Contact</a>
          <a href="#" onclick="LogOut('home.html')"
            class="list-group-item list-group-item-action text-danger">Logout</a>
        </div>
      </div>
    </div>
    
    <!-- Table -->
<main class="container mt-4" id="main-content">
      <h1>Welcome, Explore Our Library</h1>

      <!-- Books Table -->
      <h2>Books List</h2>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cover</th>
            <th>Title</th>
            <th>Author Name</th>
            <th>Category</th>
            <th>Total Copies</th>
            <th>Available Copies</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookTableBody"></tbody>
      </table>
    </main>

	
	<script src="../../js/script.js"></script>
    <script>
  (() => {
    const bookList = document.getElementById("bookTableBody");

    function fetchBooks() {
      fetch(`${BASE_URL}/api/books`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          Authorization: getAuthorization(),
        },
      })
        .then(response => response.json())
        .then(data => renderBooks(data))
        .catch(error => console.error("Error fetching books:", error));
    }
    
    async function handleSearch() {
        const query = document.getElementById("searchInput").value.trim();
        if (!query) return alert("Please enter a search term");

        try {
          const res = await fetch(`${apiUrl}/books`);
          if (!res.ok) throw new Error();
          const books = await res.json();
          displayBooksInTable(books);
        } catch {
          alert("Search error");
        }
      }

    function renderBooks(books) {
      bookList.innerHTML = "";

      books.forEach(book => {
        // Load book cover image if available
        if (book.bookCover) {
          fetch(`${BASE_URL}/api/books/images/${book.bookCover}`, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: getAuthorization(),
            },
          })
            .then(response => {
              if (!response.ok) throw new Error("Cover image not found");
              return response.blob();
            })
            .then(blob => {
              const reader = new FileReader();
              reader.onloadend = () => {
                appendBookRow(book, reader.result);
              };
              reader.readAsDataURL(blob);
            })
            .catch(() => appendBookRow(book, null));
        } else {
          appendBookRow(book, null);
        }
      });
    }

    function appendBookRow(book, imageUrl = null) {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${book.bookId}</td>
        <td>
          ${
            imageUrl
              ? `<img src="${imageUrl}" width="60" height="80" style="object-fit: cover;" onerror="this.onerror=null;this.outerHTML='<i class=\\'bi bi-book fs-3\\'></i>';" />`
              : `<i class="bi bi-book fs-3"></i>`
          }
        </td>
        <td>${book.bookTitle}</td>
        <td>${book.authorName || "—"}</td>
        <td>${book.categoryName || "—"}</td>
        <td>${book.totalCopies}</td>
        <td>${book.availableCopies}</td>
        <td>
          <button class="btn btn-sm btn-primary borrow-btn">Borrow</button>
        </td>
      `;

      row.querySelector(".borrow-btn").addEventListener("click", () => {
        issueBook(book.bookId);
      });

      bookList.appendChild(row);
    }
    async function issueBook(bookId) {
    	  try {
    	    const borrowDate = new Date().toISOString().split("T")[0]; // Format: YYYY-MM-DD
    	    const borrowReturnDate = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split("T")[0]; // 14 days later
    	    const borrowRecord = {
    	      borrowDate: borrowDate,
    	      borrowReturnDate: borrowReturnDate,
    	      bookId: bookId,
    	      userId: getUserId() // Replace this with your logic to get the logged-in user ID
    	    };

    	    const res = await fetch(`${BASE_URL}/api/borrowRecords/borrow`, {
    	      method: "POST",
    	      headers: {
    	        "Content-Type": "application/json",
    	        Authorization: getAuthorization()
    	      },
    	      body: JSON.stringify(borrowRecord)
    	    });

    	    if (!res.ok) throw new Error("Failed to issue book");

    	    alert("Book issued successfully!");
    	    fetchAndDisplayBooks();
    	  } catch (error) {
    	    alert(error.message);
    	  }
    	}

    fetchBooks();
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

  </body>
</html>
