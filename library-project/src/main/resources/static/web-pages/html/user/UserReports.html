<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container-fluid">
      <a href="User.html" class="btn btn-outline-light bg-primary">Back to Dashboard</a>
    </div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">User Reports Dashboard</h2>

    <!-- Mini Stats Row -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="d-flex justify-content-between">
                <div class="mini-card bg-primary text-white p-3 rounded-3 me-2 flex-fill">
                    <div class="mini-title">Total Books</div>
                    <div class="mini-value fs-3 fw-bold" id="totalBooks">--</div>
                </div>
                <div class="mini-card bg-success text-white p-3 rounded-3 ms-2 flex-fill">
                    <div class="mini-title">Active Borrows</div>
                    <div class="mini-value fs-3 fw-bold" id="activeBorrows">--</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Charts Row -->
    <div class="row">
        <!-- Books by Category -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">Books by Category</div>
                <div class="card-body">
                    <canvas id="booksByCategoryChart" height="200"></canvas>
                </div>
            </div>
        </div>

        <!-- Monthly Borrowing Activity -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">Monthly Borrowing Activity</div>
                <div class="card-body">
                    <canvas id="monthlyBorrowChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Top Borrowed Books Row -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h4>Top 5 Most Borrowed Books</h4>
                </div>
                <div class="card-body">
                    <canvas id="topBorrowedBooksChart" height="100"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .mini-card {
        transition: transform 0.2s;
        min-height: 100px;
    }

    .mini-card:hover {
        transform: translateY(-3px);
    }

    .mini-title {
        font-size: 0.9rem;
        opacity: 0.9;
    }

    .mini-value {
        margin-top: 0.5rem;
    }
</style>

<script>
    // Get common elements first
    const token = localStorage.getItem("token");
    const apiBase = "http://localhost:8080/api";

    if (!token) {
        window.location.href = "/login.html"; // Redirect if no token
    }

    // Generic error handler
    function handleError(error) {
        console.error("Request failed:", error);
        // Add your error handling UI here
    }

    // Chart 1: Books by Category
    fetch(`${apiBase}/books/categoryCount`, {
        headers: { 'Authorization': `Bearer ${token}` }
    })
        .then(res => {
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
        })
        .then(data => {
            // Handle array of arrays response ([categoryName, count])
            const labels = data.map(d => d[0]); // First element = category name
            const values = data.map(d => d[1]); // Second element = count

            new Chart(document.getElementById('booksByCategoryChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Books by Category',
                        data: values,
                        backgroundColor: 'rgba(75, 192, 192, 0.6)'
                    }]
                }
            });
        })
        .catch(handleError);

        function loadMiniCards() {
                // Total Books
                fetch(`${apiBase}/books/count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                    .then(res => res.json())
                    .then(data => document.getElementById('totalBooks').textContent = data)
                    .catch(console.error);

                // Active Borrows
                fetch(`${apiBase}/borrowRecords/activeCount`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                    .then(res => res.json())
                    .then(data => document.getElementById('activeBorrows').textContent = data)
                    .catch(console.error);
               }

        loadMiniCards();


    // Chart 2: Top Borrowed Books
    let topBorrowedBooksChartInstance = null; // Add this at the top
    async function fetchTopBorrowedBooks() {
            try {
                const res = await fetch(`${apiBase}/borrowRecords/topBooks`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

                const data = await res.json();
                const labels = data.map(item => item[0]);
                const counts = data.map(item => item[1]);

                // Destroy existing chart
                if (topBorrowedBooksChartInstance) {
                    topBorrowedBooksChartInstance.destroy();
                }

                // Create new chart
                const ctx = document.getElementById('topBorrowedBooksChart').getContext('2d');
                topBorrowedBooksChartInstance = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Times Borrowed",
                            data: counts,
                            backgroundColor: "rgba(75, 192, 192, 0.5)",
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: { y: { beginAtZero: true } }
                    }
                });
            } catch (error) {
                handleError(error);
            }
       }
    fetchTopBorrowedBooks();

    // Chart 3: Monthly Borrowing Activity
    fetch(`${apiBase}/borrowRecords/monthlyCount`, {
        headers: { 'Authorization': `Bearer ${token}` }
    })
        .then(res => {
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
        })
        .then(data => {
            // Handle array of arrays response ([month, count])
            const labels = data.map(d => d[0]);
            const values = data.map(d => d[1]);

            new Chart(document.getElementById('monthlyBorrowChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Monthly Borrow Count',
                        data: values,
                        borderColor: 'rgba(153, 102, 255, 1)',
                        fill: false,
                        tension: 0.4
                    }]
                }
            });
        })
        .catch(handleError);
</script>
