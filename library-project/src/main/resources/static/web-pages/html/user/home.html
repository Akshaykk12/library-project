<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Home - Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      padding-top: 56px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="home.html">
        <i class="bi bi-book-fill"></i> Library Management
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#homeNavbarContent" aria-controls="homeNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="homeNavbarContent">
        <form class="d-flex ms-auto">
          <input class="form-control me-2" type="search" placeholder="Search books" aria-label="Search">
          <button class="btn btn-outline-light" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>

        <ul class="navbar-nav ms-3">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="loadPage('Login.html'); return false;" title="Go to Cart (Login Required)">
              <i class="bi bi-cart-fill"></i> Cart
            </a>
          </li>
        </ul>

        <ul class="navbar-nav ms-3">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="accountDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i> Account
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
              <li><a class="dropdown-item" href="#" onclick="loadPage('Login.html'); return false;"><i class="bi bi-box-arrow-in-right"></i> Login</a></li>
              <li><a class="dropdown-item" href="#" onclick="loadPage('Register.html'); return false;"><i class="bi bi-pencil-square"></i> Register</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="container mt-5" id="main-content">
    <div class="text-center">
      <h1 class="mb-4">Welcome to the Library</h1>
      <p class="lead">Explore, borrow, and manage your favorite books online.</p>
    </div>
  </main>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
