<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <title>Contact Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h2 class="mb-4 text-center">Contact Library Support</h2>
  <nav class="navbar navbar-dark bg-white">
    <div class="container-fluid">
      <!-- <a class="navbar-brand" href="#"><i class="bi bi-book"></i> Library</a> -->
      <a href="User.html" class="btn btn-outline-light bg-primary">Back to Dashboard</a>
    </div>
  </nav>
  <div class="row">
    <!-- Contact Form -->
    <div class="col-md-7">
      <div class="card shadow p-4">
        <form id="contactForm">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>

        <div id="responseMsg" class="alert alert-success mt-3 d-none">Message sent! We'll get back to you shortly.</div>
      </div>
    </div>

    <!-- Contact Info -->
    <div class="col-md-5">
      <div class="card p-4 shadow bg-light">
        <h5 class="mb-3">Admin Contact Details</h5>
        <p><strong>Email:</strong> <a href="mailto:admin@librarysystem.com">admin@librarysystem.com</a></p>
        <p><strong>Phone:</strong> <a href="tel:+918888888888">+91-88888-88888</a></p>
        <p><strong>WhatsApp:</strong> <a href="https://wa.me/918888888888" target="_blank">Chat on WhatsApp</a></p>
        <p><strong>Office Hours:</strong> Mon - Fri, 9 AM to 6 PM</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      // You can later integrate with EmailJS or backend mail API
      document.getElementById("responseMsg").classList.remove("d-none");
      this.reset();
    });
  </script>

</body>
</html>
