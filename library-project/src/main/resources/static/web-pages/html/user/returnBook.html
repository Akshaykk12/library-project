<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Return Books - Library System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-white">
    <div class="container-fluid">
      <a href="User.html" class="btn btn-outline-light bg-primary">Back to Dashboard</a>
    </div>
  </nav>

  <!-- Main -->
<main class="container mt-5">
  <h2 class="text-primary">Books You Have Borrowed</h2>
  <div id="returnBooks" class="row mt-4"></div>
  <div id="noBooksMsg" class="alert alert-info d-none text-danger">You have no borrowed books to return.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="script.js"></script>

<script>
  (async function () {
    const apiUrl = "http://localhost:8080/api";
    const userId = getUserId();
    const returnBooksDiv = document.getElementById("returnBooks");
    const noBooksMsg = document.getElementById("noBooksMsg");

    async function loadIssuedBooks() {
      try {
        const borrowRes = await fetch(`${apiUrl}/borrowRecords/user/${userId}`, {
          headers: {
            "Content-Type": "application/json",
            "Authorization": getAuthorization(),
          },
        });

        const userRecords = await borrowRes.json();
        const issuedRecords = userRecords.filter(rec => rec.borrowStatus === "Borrowed");

        if (issuedRecords.length === 0) {
          noBooksMsg.classList.remove("d-none");
          return;
        } else {
          noBooksMsg.classList.add("d-none");
        }

        returnBooksDiv.innerHTML = '';

        for (const record of issuedRecords) {

          console.log(record);

          const col = document.createElement("div");
          col.className = "col-md-4";
          col.id = `borrow-${record.borrowId}`;

          const card = document.createElement("div");
          card.className = "card mb-3";

          const cardBody = document.createElement("div");
          cardBody.className = "card-body";

          const fineId = `fine-${record.borrowId}`;

          cardBody.innerHTML = `
            <h5 class="card-title">${record.bookTitle || 'Title Not Available'}</h5>
            <p class="card-text">Borrow ID: ${record.borrowId ?? 'N/A'}</p>
            <p class="card-text"><strong>Issued On:</strong> ${moment(record.borrowDate).format("YYYY-MM-DD")}</p>
            <p class="card-text"><strong>Due Date:</strong> ${moment(record.borrowReturnDate).format("YYYY-MM-DD")}</p>
            <p class="card-text text-danger" id="${fineId}">Fine: ₹ --</p>
          `;

          const returnBtn = document.createElement("button");
          returnBtn.className = "btn btn-success";
          returnBtn.textContent = "Return Book";

          returnBtn.addEventListener("click", async () => {
            returnBtn.disabled = true;
            returnBtn.textContent = "Processing...";

            try {
              const res = await fetch(`${apiUrl}/borrowRecords/markReturned/${record.borrowId}`, {
                method: "PUT",
                headers: {
                  "Authorization": getAuthorization(),
                }
              });

              if (!res.ok) throw new Error("Failed to mark as returned");

              const fineRes = await fetch(`${apiUrl}/borrowRecords/calculateFine/${record.borrowId}`, {
                headers: {
                  "Authorization": getAuthorization(),
                }
              });

              const fineAmount = await fineRes.json();
              document.getElementById(fineId).textContent = `Fine: ₹ ${fineAmount}`;

              returnBtn.classList.remove("btn-success");
              returnBtn.classList.add("btn-secondary");
              returnBtn.textContent = "Returned";
              returnBtn.disabled = true;

            } catch (error) {
              alert("Failed to return book. Please try again.");
              returnBtn.disabled = false;
              returnBtn.textContent = "Return Book";
              console.error(error);
            }
          });

          cardBody.appendChild(returnBtn);
          card.appendChild(cardBody);
          col.appendChild(card);
          returnBooksDiv.appendChild(col);
        }

      } catch (err) {
        alert("Failed to load issued books.");
        console.error(err);
      }
    }

    loadIssuedBooks();
  })();
</script>

</body>
</html>
