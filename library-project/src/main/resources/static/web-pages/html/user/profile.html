<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Profile</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    #userImageDisplay,
    #userImagePreview {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ddd;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      border-radius: 1rem;
      padding: 1.5rem;
    }

    .form-label {
      font-weight: 500;
    }

    .img-container {
      text-align: right;
    }

    .form-control:disabled {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="container mt-5">
  <div class="profile-header mb-4">
    <h2>Profile Settings</h2>
    <a href="User.html" class="btn btn-outline-primary">Back to Dashboard</a>
  </div>

  <div class="card">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h5 class="mb-3">Your Information</h5>
        <!-- Fields -->
        <div class="mb-3">
          <label class="form-label">Name</label>
          <div id="userNameField">
            <span id="userNameValue"></span>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone</label>
          <div id="userContactField">
            <span id="userContactValue"></span>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <div id="userEmailField">
            <span id="userEmailValue"></span>
          </div>
        </div>
      </div>

      <div class="img-container">
        <div id="userImageField">
          <img id="userImageDisplay" src="https://via.placeholder.com/150" alt="Profile Image" />
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="text-end">
      <button id="editBtn" class="btn btn-primary">Edit</button>
      <button id="saveBtn" class="btn btn-success d-none">Save</button>
      <button id="cancelBtn" class="btn btn-secondary d-none">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>

    (function () {
      let currentUser = null;
      let isEditing = false;

      const editBtn = document.getElementById("editBtn");
      const saveBtn = document.getElementById("saveBtn");
      const cancelBtn = document.getElementById("cancelBtn");

      const userNameField = document.getElementById("userNameField");
      const userContactField = document.getElementById("userContactField");
      const userEmailField = document.getElementById("userEmailField");
      const userImageField = document.getElementById("userImageField");

      function renderViewMode() {
        userNameField.innerHTML = `<span id="userNameValue">${currentUser.userName || ""}</span>`;
        userContactField.innerHTML = `<span id="userContactValue">${currentUser.userContact || ""}</span>`;
        userEmailField.innerHTML = `<span id="userEmailValue">${currentUser.userEmail || ""}</span>`;
        const imageUrl = currentUser.userImage.startsWith('data:')
  ? currentUser.userImage
  : `${BASE_URL}/api/users/images/${currentUser.userImage}`;
userImageField.innerHTML = `<img id="userImageDisplay" src="${imageUrl}" alt="Profile Image" />`;


        editBtn.classList.remove("d-none");
        saveBtn.classList.add("d-none");
        cancelBtn.classList.add("d-none");
        isEditing = false;
      }

      function renderEditMode() {
        userNameField.innerHTML = `<input type="text" id="userNameInput" class="form-control" value="${currentUser.userName || ""}">`;
        userContactField.innerHTML = `<input type="text" id="userContactInput" class="form-control" value="${currentUser.userContact || ""}">`;
        userEmailField.innerHTML = `<input type="email" id="userEmailInput" class="form-control" value="${currentUser.userEmail || ""}">`;

        const imageUrl = currentUser.userImage.startsWith('data:')
  ? currentUser.userImage
  : `${BASE_URL}/api/users/images/${currentUser.userImage}`;
userImageField.innerHTML = `<img id="userImageDisplay" src="${imageUrl}" alt="Profile Image" />`;


        document.getElementById("userImageInput").addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              document.getElementById("userImagePreview").src = event.target.result;
            };
            reader.readAsDataURL(file);
          }
        });

        editBtn.classList.add("d-none");
        saveBtn.classList.remove("d-none");
        cancelBtn.classList.remove("d-none");
        isEditing = true;
      }

      async function loadUser() {
        try {
          const currId = getUserId();
          if (!currId) {
            alert("No user ID found. Please login.");
            return;
          }

          const response = await fetch(`${BASE_URL}/api/users`, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              "Authorization": getAuthorization(),
            },
          });

          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
          const users = await response.json();

          currentUser = users.find(u => u.userId?.toString() === currId.toString());
          if (!currentUser) {
            alert("User not found!");
            return;
          }

          renderViewMode();
        } catch (err) {
          console.error("Error loading user:", err);
          alert("Failed to load user details.");
        }
        console.log(currentUser.userImage);
      }

      async function saveUser() {
        try {
          // Simple validation
          const name = document.getElementById("userNameInput").value.trim();
          const phone = document.getElementById("userContactInput").value.trim();
          const email = document.getElementById("userEmailInput").value.trim();
          if (!name || !phone || !email) {
            alert("Please fill in all fields.");
            return;
          }
          if (!validateEmail(email)) {
            alert("Please enter a valid email address.");
            return;
          }

          const imageInput = document.getElementById("userImageInput");
          let imageData = currentUser.userImage;

          if (imageInput && imageInput.files && imageInput.files[0]) {
            imageData = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = (e) => resolve(e.target.result);
              reader.onerror = (err) => reject(err);
              reader.readAsDataURL(imageInput.files[0]);
            });
          }

          const updatedUser = {
            ...currentUser,
            userName: name,
            userContact: phone,
            userEmail: email,
            userImage: imageData,
          };

          const response = await fetch(`${BASE_URL}/api/users/${currentUser.userId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization": getAuthorization(),
            },
            body: JSON.stringify(updatedUser),
          });

          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

          currentUser = updatedUser;
          renderViewMode();
          alert("Profile updated successfully!");
        } catch (err) {
          console.error("Failed to update user:", err);
          alert("Failed to update profile. Please try again.");
        }
      }

      function validateEmail(email) {
        // Simple email regex
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      editBtn.addEventListener("click", () => {
        if (!isEditing) renderEditMode();
      });

      saveBtn.addEventListener("click", () => {
        saveUser();
      });

      cancelBtn.addEventListener("click", () => {
        renderViewMode();
      });

      loadUser();
    })();
  </script>
</body>
</html>
