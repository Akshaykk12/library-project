<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Profile</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    #userImageDisplay {
      max-width: 150px;
      max-height: 150px;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>
<body class="container mt-5">
  <h2 class="mb-4">Profile Settings</h2>

  <nav class="navbar navbar-light bg-white mb-4">
    <div class="container-fluid">
      <a href="User.html" class="btn btn-outline-light bg-primary text-white">
        Back to Dashboard
      </a>
    </div>
  </nav>

  <div id="profileContainer">
    <!-- Name -->
    <div class="mb-3">
      <label class="form-label" for="userNameInput">Name</label>
      <div id="userNameField" class="border rounded p-2">
        <span id="userNameValue"></span>
      </div>
    </div>

    <!-- Phone -->
    <div class="mb-3">
      <label class="form-label" for="userContactInput">Phone</label>
      <div id="userContactField" class="border rounded p-2">
        <span id="userContactValue"></span>
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label" for="userEmailInput">Email</label>
      <div id="userEmailField" class="border rounded p-2">
        <span id="userEmailValue"></span>
      </div>
    </div>

    <!-- Image -->
    <div class="mb-3">
      <label class="form-label" for="userImageInput">Profile Image</label>
      <div id="userImageField" class="border rounded p-2">
        <img id="userImageDisplay" src="" alt="Profile Image" />
      </div>
    </div>

    <!-- Common Edit / Save / Cancel buttons -->
    <div class="mb-3">
      <button id="editBtn" class="btn btn-primary">Edit</button>
      <button id="saveBtn" class="btn btn-success d-none">Save</button>
      <button id="cancelBtn" class="btn btn-secondary d-none">Cancel</button>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    // Mock functions (replace with your real implementations)

    (function () {
      const currId = getUserId();
      const apiUrl = "http://localhost:8080/api";
      let currentUser = null;
      let isEditing = false;

      // DOM references
      const editBtn = document.getElementById("editBtn");
      const saveBtn = document.getElementById("saveBtn");
      const cancelBtn = document.getElementById("cancelBtn");

      const userNameField = document.getElementById("userNameField");
      const userContactField = document.getElementById("userContactField");
      const userEmailField = document.getElementById("userEmailField");
      const userImageField = document.getElementById("userImageField");

      function renderViewMode() {
        userNameField.innerHTML = `<span id="userNameValue">${currentUser.userName || ""}</span>`;
        userContactField.innerHTML = `<span id="userContactValue">${currentUser.userContact || ""}</span>`;
        userEmailField.innerHTML = `<span id="userEmailValue">${currentUser.userEmail || ""}</span>`;
        userImageField.innerHTML = `<img id="userImageDisplay" src="${currentUser.userImage || 'https://via.placeholder.com/150'}" alt="Profile Image" />`;

        editBtn.classList.remove("d-none");
        saveBtn.classList.add("d-none");
        cancelBtn.classList.add("d-none");
        isEditing = false;
      }

      function renderEditMode() {
        userNameField.innerHTML = `<input type="text" id="userNameInput" class="form-control" value="${currentUser.userName || ""}">`;
        userContactField.innerHTML = `<input type="text" id="userContactInput" class="form-control" value="${currentUser.userContact || ""}">`;
        userEmailField.innerHTML = `<input type="email" id="userEmailInput" class="form-control" value="${currentUser.userEmail || ""}">`;
        userImageField.innerHTML = `
          <input type="url" id="userImageInput" class="form-control mb-2" placeholder="Image URL" value="${currentUser.userImage || ""}">
          <img id="userImagePreview" src="${currentUser.userImage || 'https://via.placeholder.com/150'}" alt="Image Preview" style="max-width: 150px; max-height: 150px; border-radius: 8px; object-fit: cover;">
        `;

        // Live update preview when input changes
        document.getElementById("userImageInput").addEventListener("input", (e) => {
          document.getElementById("userImagePreview").src = e.target.value || 'https://via.placeholder.com/150';
        });

        editBtn.classList.add("d-none");
        saveBtn.classList.remove("d-none");
        cancelBtn.classList.remove("d-none");
        isEditing = true;
      }

      async function loadUser() {
  try {
    const currId = getUserId();
    console.log("currId:", currId);

    if (!currId) {
      alert("No user ID found. Please login.");
      return;
    }

    const response = await fetch(`${apiUrl}/users`, {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
        "Authorization": getAuthorization(),
      },
    });

    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

    const users = await response.json();
    console.log("users:", users);

    currentUser = users.find(u => u.userId?.toString() === currId.toString());

    if (!currentUser) {
      alert("User not found!");
      return;
    }

    renderViewMode();
  } catch (err) {
    console.error("Error loading user:", err);
    alert("Failed to load user details.");
  }
}


      async function saveUser() {
        let imageData = currentUser.userImage; // default

        const imageInput = document.getElementById("userImageInput");
        if (imageInput && imageInput.files && imageInput.files[0]) {
          imageData = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (err) => reject(err);
            reader.readAsDataURL(imageInput.files[0]);
          });
        }
        const updatedUser = {
          ...currentUser,
          userName: document.getElementById("userNameInput").value.trim(),
          userContact: document.getElementById("userContactInput").value.trim(),
          userEmail: document.getElementById("userEmailInput").value.trim(),
          userImage: document.getElementById("userImageInput").value.trim(),
        };

        try {
          const response = await fetch(`${apiUrl}/users/${currentUser.userId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization": getAuthorization(),
            },
            body: JSON.stringify(updatedUser),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          currentUser = updatedUser;
          renderViewMode();
          alert("Profile updated successfully!");
        } catch (err) {
          console.error("Failed to update user:", err);
          alert("Failed to update profile. Please try again.");
        }
      }

      // Button handlers
      editBtn.addEventListener("click", () => {
        if (!isEditing) {
          renderEditMode();
        }
      });

      saveBtn.addEventListener("click", () => {
        saveUser();
      });

      cancelBtn.addEventListener("click", () => {
        renderViewMode();
      });

      // Initial load
      loadUser();
    })();
  </script>
</body>
</html>
