<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
</head>

<body class="container mt-5">
	<h2>Login</h2>
	<form id="loginForm">
		<div class="mb-3">
			<label for="email" class="form-label">Email address</label> <input
				type="email" class="form-control" id="email" required />
		</div>
		<div class="mb-3">
			<label for="password" class="form-label">Password</label> <input
				type="password" class="form-control" id="password" required />
		</div>
		<button type="submit" class="btn btn-primary">Login</button>
		<div id="error" class="text-danger mt-3"></div>
		<p class="mt-3 text-secondary">
			Don't have an account? <a href="register.html" class="text-info">Sign
				Up</a>
		</p>
	</form>

	<script src="../../js/script.js"></script>
	<script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      verify();
    });

    function verify() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      fetch("http://localhost:8080/auth/signin", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ userName: email, password })
      })
        .then(response => {
          // Handle different status codes explicitly
          if (response.status === 200) {
            return response.json();
          } else if (response.status === 404) {
            throw new Error("404 Not Found - Users data not available.");
          } else if (response.status === 401) {
            throw new Error("401 Unauthorized - Invalid token or access denied.");
          } else if (response.status === 500) {
            throw new Error("500 Internal Server Error.");
          } else {
            throw new Error(`Unexpected status code: ${response.status}`);
          }
        })
        .then(data => {
          if (!data || !data.token) {
            throw new Error("Token Not Found");
          }

          // Store the token and redirect based on user type
          localStorage.setItem("token", data.token);
          const decoded = decodeJWT(data.token);
          const userType = decoded.usertype;
          console.log(userType);

          if (userType === "USER") {
            window.location.href = "User.html";
          } else {
            window.location.href = "../admin/admin.html";
          }
        })
        .catch(error => {
          console.error(error);
          document.getElementById("error").textContent = error.message || "Something went wrong. Please try again.";
        });
    }

  </script>
</body>

</html>
