<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overdue Borrow Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container mt-5">
  <h2 class="mb-4">Overdue Borrow Records</h2>

  <div id="overdueRecordsContainer" class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Borrow ID</th>
          <th>User ID</th>
          <th>Book ID</th>
          <th>Borrow Date</th>
          <th>Return Date</th>
          <th>Status</th>
          <th>Fine (₹)</th>
        </tr>
      </thead>
      <tbody id="recordsTableBody">
        <!-- Rows will be injected by JS -->
      </tbody>
    </table>
  </div>

  <script>
    (async function () {
      const apiUrl = "http://localhost:8080/api/borrowRecords";

      function calculateFine(borrowDateStr, returnDateStr) {
        const borrowDate = new Date(borrowDateStr);
        const returnDate = new Date(returnDateStr);
        const today = new Date();

        const daysElapsed = Math.floor((today - returnDate) / (1000 * 60 * 60 * 24));
        return daysElapsed > 0 ? daysElapsed * 10 : 0; // ₹10 per overdue day
      }

      try {
        const response = await fetch(`${apiUrl}`, {
          headers: { "Authorization": getAuthorization() }
        });

        if (!response.ok) throw new Error("Failed to fetch borrow records");

        const records = await response.json();
        console.log("Received records:", records); // Debugging line
        
        const overdueRecords = records.filter(r => 
          r.borrowStatus === "Borrowed" && 
          new Date(r.borrowReturnDate) < new Date()
        );

        const tableBody = document.getElementById("recordsTableBody");
        overdueRecords.forEach(record => {
          const fine = calculateFine(record.borrowDate, record.borrowReturnDate);
          const row = `
            <tr>
              <td>${record.borrowId}</td>
              <td>${record.userId || "-"}</td>
              <td>${record.bookId || "-"}</td>
              <td>${record.borrowDate}</td>
              <td>${record.borrowReturnDate}</td>
              <td>${record.borrowStatus}</td>
              <td>${fine}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });

        if (overdueRecords.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="7" class="text-center">No overdue records found.</td></tr>`;
        }
      } catch (err) {
        console.error("Error loading overdue records:", err);
        document.getElementById("recordsTableBody").innerHTML =
          `<tr><td colspan="7" class="text-danger text-center">Failed to load records.</td></tr>`;
      }
    })();
  </script>
</body>
</html>
