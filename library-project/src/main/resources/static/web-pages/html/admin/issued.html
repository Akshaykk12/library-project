<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Issued Books Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { padding-top: 20px; background-color: #f8f9fa; }
    .table-responsive { margin: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .navbar { margin-bottom: 20px; border-radius: 5px; }
    .overdue { color: #dc3545; font-weight: bold; }
    .due-soon { color: #ffc107; font-weight: bold; }
    .returned { color: #28a745; }
    .action-btn { min-width: 120px; }
    .badge { font-size: 0.9rem; padding: 5px 10px; }
  </style>
</head>
<body class="container">
  <h2 class="mb-4 text-primary">Currently Issued Books</h2>

  <nav class="navbar navbar-light bg-light mb-4 p-3">
    <div class="container-fluid">
      <a href="admin.html" class="btn btn-primary">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
      </a>
      <div class="d-flex">
        <span class="badge bg-danger me-2">Overdue: <span id="overdueCount">0</span></span>
        <span class="badge bg-warning text-dark">Due Soon: <span id="dueSoonCount">0</span></span>
      </div>
    </div>
  </nav>

  <div class="table-responsive">
    <table class="table table-bordered table-hover table-striped">
      <thead class="table-dark">
        <tr>
          <th>Borrow ID</th>
          <th>User</th>
          <th>Book</th>
          <th>Borrow Date</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="recordsTableBody">
      </tbody>
    </table>
  </div>

  <script>
    (async function() {
      const apiUrl = "http://localhost:8080/api/borrowRecords";
      
      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-US', {
          year: 'numeric', month: 'short', day: 'numeric'
        });
      }

      function calculateDaysRemaining(returnDate) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const dueDate = new Date(returnDate);
        return Math.ceil((dueDate - today) / 86400000);
      }

      async function markAsReturned(borrowId, button) {
        if (!confirm('Are you sure you want to mark this book as returned?')) return;
        
        try {
          const response = await fetch(
            `http://localhost:8080/api/borrowRecords/markReturned/${borrowId}`, 
            {
              method: 'PUT',
              headers: { 
                "Authorization": `Bearer ${localStorage.getItem('token')}`,
                "Content-Type": "application/json"
              }
            }
          );

          if (!response.ok) throw new Error(await response.text());

          const row = button.closest('tr');
          row.querySelector('td:nth-child(6)').innerHTML = 
            '<span class="returned">Returned</span>';
          button.disabled = true;
          button.textContent = '✓ Returned';
          button.classList.remove('btn-success');
          button.classList.add('btn-secondary');

          if (row.querySelector('.overdue')) {
            document.getElementById('overdueCount').textContent = 
              parseInt(document.getElementById('overdueCount').textContent) - 1;
          } else if (row.querySelector('.due-soon')) {
            document.getElementById('dueSoonCount').textContent = 
              parseInt(document.getElementById('dueSoonCount').textContent) - 1;
          }

        } catch (error) {
          console.error('Error:', error);
          alert('Failed to mark as returned: ' + error.message);
        }
      }

      try {
        const response = await fetch(apiUrl, {
          headers: { 
            "Authorization": `Bearer ${localStorage.getItem('token')}`,
            "Content-Type": "application/json"
          }
        });

        if (!response.ok) throw new Error(await response.text());

        const allRecords = await response.json();
        const issuedRecords = allRecords.filter(record => 
          record.borrowStatus === "Borrowed" || record.borrowStatus === "Overdue"
        );

        const tableBody = document.getElementById("recordsTableBody");
        let overdueCount = 0;
        let dueSoonCount = 0;

        if (issuedRecords.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="7" class="text-center text-muted py-4">
                <i class="bi bi-check-circle"></i> No currently issued books
              </td>
            </tr>`;
          return;
        }

        issuedRecords.forEach(record => {
          const daysRemaining = calculateDaysRemaining(record.borrowReturnDate);

          if (daysRemaining < 0) overdueCount++;
          else if (daysRemaining <= 3) dueSoonCount++;

          const statusClass = daysRemaining < 0 ? 'overdue' : 
                            daysRemaining <= 3 ? 'due-soon' : '';
          const statusText = daysRemaining < 0 ? 
                            `${Math.abs(daysRemaining)} days overdue` : 
                            `${daysRemaining} days remaining`;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${record.borrowId}</td>
            <td>${record.userId || '-'} ${record.userName ? `- ${record.userName}` : ''}</td>
            <td>${record.bookId || '-'} ${record.bookTitle ? `- ${record.bookTitle}` : ''}</td>
            <td>${formatDate(record.borrowDate)}</td>
            <td>${formatDate(record.borrowReturnDate)}</td>
            <td class="${statusClass}">${statusText}</td>
            <td>
              <button class="btn btn-sm btn-success action-btn mark-returned" 
                      data-id="${record.borrowId}">
                Mark Returned
              </button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        document.getElementById('overdueCount').textContent = overdueCount;
        document.getElementById('dueSoonCount').textContent = dueSoonCount;

        document.querySelectorAll('.mark-returned').forEach(btn => {
          btn.addEventListener('click', (e) => 
            markAsReturned(e.target.getAttribute('data-id'), e.target)
          );
        });

      } catch (error) {
        console.error("Error loading records:", error);
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center text-danger py-4">
              <i class="bi bi-exclamation-triangle"></i> Error loading records
            </td>
          </tr>`;
      }
    })();
  </script>
</body>
</html>
