<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="container my-5 border p-4">
  <h2 class="mb-4">Registered Users: </h2>

  <!-- Search bar for filtering users -->
  <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search by Name or Email">

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>User Name</th>
        <th>User Email</th>
        <th>User PhoneNo</th>
        <th>Actions</th> 
      </tr>
    </thead>
    <tbody id="usersTableBody"></tbody>
  </table>

  <script>
      (
          function(){
              const apiUrl = 'http://localhost:8080/api/users';
              let allUsers = [];
              const token = localStorage.getItem("token"); 

              // Add proper authorization header
            function getAuthorization() {
              return `Bearer ${token}`;
            }

            function fetchandLoadUsers() {
              fetch(apiUrl, {
                headers: {
                  "Authorization": getAuthorization() 
                }
              })
                .then(res => {
                  if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                  return res.json();
                })
                .then(data => {
                  allUsers = data;
                  renderUserTable(data);
                })
                .catch(error => console.error('Error loading users:', error));
                 }
              

              // Render the user table
              function renderUserTable(users) {
                  let tbody = document.getElementById("usersTableBody");
                  tbody.innerHTML = ""; 
                  users.forEach(user => {
                      let row = document.createElement("tr");
                      //console.log(user)
                      row.innerHTML = `
                          <td>${user.userName}</td>
                          <td>${user.userEmail}</td>
                          <td>${user.userContact}</td>
                          <td>
                              <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${user.userId}">
                                  <i class="bi bi-trash"></i> Delete
                              </button>
                          </td>
                      `;
                      tbody.appendChild(row);
                  });

                  // Add delete button event listener
                  document.querySelectorAll(".delete-btn").forEach(btn => {
                      btn.addEventListener("click", function() {
                          const userId = this.getAttribute("data-id");
                          deleteUser(userId);
                      });
                  });
              }

              function deleteUser(id) {
              if (confirm("Are you sure you want to delete this user?")) {
                fetch(`${apiUrl}/${id}`, {
                  method: "DELETE",
                  headers: {
                    "Authorization": getAuthorization() 
                  }
                })
                  .then(res => {
                    if (!res.ok) throw new Error(`Delete failed: ${res.status}`);
                    alert("User deleted successfully");
                    fetchandLoadUsers();
                  })
                  .catch(error => {
                    console.error('Delete error:', error);
                    alert("Failed to delete user");
                  });
              }
            }
        

         
              document.getElementById("searchInput").addEventListener("input", function () {
              const searchTerm = this.value.toLowerCase();
              const filteredUsers = allUsers.filter(user =>
                user.userName.toLowerCase().includes(searchTerm) ||
                user.userEmail.toLowerCase().includes(searchTerm)
              );
              renderUserTable(filteredUsers);
            });

          
            fetchandLoadUsers();
          }
      )();
  </script>
</body>
</html>
